<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'Courier New',monospace" font-weight="700">
<defs>
