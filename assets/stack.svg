  .band{animation:roll 6s linear infinite}
  @keyframes roll{from{transform:translateY(-90px)}to{transform:translateY(320px)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
